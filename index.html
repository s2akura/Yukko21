<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルなWebサイト</title>

  <style>
    * { <img src=https://github.com/s2akura/Yukko21/blob/main/cupcake.jpg?raw=true"" alt="サンプル">
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333;
      background-color: #f5f5f5;
      padding-bottom: 100px; /* 固定フッター分の余白 */
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    section {
      background-color: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    section h2 {
      color: #2c3e50;
      margin-top: 0;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 15px;
    }

    footer p {
      margin: 5px 0;
    }

    footer a {
      color: #74b9ff;
      text-decoration: none;
      margin: 0 8px;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>Victoria Bell </h1>
  </header>

  <main>
    <section>
      <h2>愛知県の博物館</h2>
      <p>
        
      </p>
    </section>

    <section>
      <h2>サービス・活動内容</h2>
      <p>
        TPO、
      </p>
    </section>
  </main>

  <footer>
    <p>お問い合わせ：example@example.com</p>
    <p>
      <a href="https://twitter.com/" target="_blank">X</a>
      <a href="https://www.instagram.com/" target="_blank">Instagram</a>
      <a href="https://www.facebook.com/" target="_blank">Facebook</a>
    </p>
  </footer>

</body>
</html>
